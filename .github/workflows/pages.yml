# Pubblica la cartella www/ su GitHub Pages a ogni push su "main".
# L'app Android (con server.url impostato) carica da lì la versione più recente: aggiornamenti senza reinstallare.
name: Pubblica BTV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci            # il postinstall copia hls.js e pako in www/vendor
      # Sito: all'indirizzo principale una pagina di presentazione; il lettore sta in player.html (usato dalle app).
      - name: Prepara il sito
        run: |
          cp -r www _site
          mv _site/index.html _site/player.html
          cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
